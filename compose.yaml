services:
  prometheus:
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - type: bind
        source: ./prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: volume
        source: prometheus-data
        target: /prometheus

  grafana:
    image: grafana/grafana:13.1.3
    restart: unless-stopped
    network_mode: host
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}"
      GF_SERVER_HTTP_ADDR: "${GRAFANA_BIND_ADDRESS:-127.0.0.1}"
      GF_SERVER_HTTP_PORT: "${GRAFANA_PORT:-3000}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - type: bind
        source: ./grafana/provisioning/datasources/prometheus.yml
        target: /etc/grafana/provisioning/datasources/prometheus.yml
        read_only: true
      - type: volume
        source: grafana-data
        target: /var/lib/grafana

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: /
        target: /rootfs
        read_only: true
      - type: bind
        source: /var/run
        target: /var/run
        read_only: true
      - type: bind
        source: /sys
        target: /sys
        read_only: true
      - type: bind
        source: /var/lib/docker
        target: /var/lib/docker
        read_only: true
      - type: bind
        source: /dev/disk
        target: /dev/disk
        read_only: true
    networks:
      - observability

networks:
  observability:
    driver: bridge

volumes:
  grafana-data:
  prometheus-data:
